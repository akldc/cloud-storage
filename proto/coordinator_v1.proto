syntax = "proto3";

package object_storage.control.v1;

// V1 control traffic only. Placement returns candidates, not confirmed replicas.
// Invalid fields: INVALID_ARGUMENT; unknown/expired node: NOT_FOUND;
// occupied node ID or endpoint: ALREADY_EXISTS; stale instance or changed
// endpoint: FAILED_PRECONDITION; full registry: RESOURCE_EXHAUSTED;
// insufficient placement candidates: FAILED_PRECONDITION.
service Coordinator {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeReply);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeReply);
  rpc GetNode(GetNodeRequest) returns (NodeInfo);
  rpc ListNodes(ListNodesRequest) returns (ListNodesReply);
  rpc GetPlacement(GetPlacementRequest) returns (GetPlacementReply);
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadReply);
  rpc GetUpload(GetUploadRequest) returns (GetUploadReply);
  rpc ConfirmChunk(ConfirmChunkRequest) returns (ConfirmChunkReply);
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadReply);
  rpc GetObject(GetObjectRequest) returns (GetObjectReply);
}

message RegisterNodeRequest {
  string node_id = 1;
  string instance_id = 2;
  string host = 3;
  uint32 port = 4;
}
message RegisterNodeReply {
  uint32 heartbeat_interval_ms = 1;
  uint32 lease_timeout_ms = 2;
}
message HeartbeatRequest { string node_id = 1; string instance_id = 2; }
message HeartbeatReply {}
message UnregisterNodeRequest { string node_id = 1; string instance_id = 2; }
message UnregisterNodeReply {}
message GetNodeRequest { string node_id = 1; }
message ListNodesRequest {}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  NODE_ONLINE = 1;
  NODE_OFFLINE = 2;
}
message NodeInfo {
  string node_id = 1;
  string instance_id = 2;
  string host = 3;
  uint32 port = 4;
  NodeState state = 5;
  int64 last_seen_unix_ms = 6; // Observability only; never used for leases.
}
message ListNodesReply { repeated NodeInfo nodes = 1; }
message GetPlacementRequest { string chunk_id = 1; uint32 replica_count = 2; }
message GetPlacementReply { repeated NodeInfo candidates = 1; }

// Object bytes stay on the Storage Node HTTP data path. Version and generation
// are fixed to 1 for this single-replica object protocol.
message UploadChunk {
  uint32 index = 1;
  uint64 offset = 2;
  uint64 size = 3;
  string sha256 = 4;
}
message PlannedChunk {
  uint32 index = 1;
  string chunk_id = 2;
  uint64 offset = 3;
  uint64 size = 4;
  string sha256 = 5;
  uint64 generation = 6;
  string target_node_id = 7;
  bool confirmed = 8;
  string confirmed_node_id = 9;
}
enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  UPLOAD_PREPARING = 1;
  UPLOAD_COMMITTED = 2;
  UPLOAD_ABORTED = 3;
}
message BeginUploadRequest {
  string request_id = 1;
  uint64 total_size = 2;
  string file_sha256 = 3;
  repeated UploadChunk chunks = 4;
}
message BeginUploadReply {
  string object_id = 1;
  string upload_id = 2;
  uint64 version = 3;
  repeated PlannedChunk chunks = 4;
}
message GetUploadRequest { string request_id = 1; }
message GetUploadReply {
  string object_id = 1;
  string upload_id = 2;
  UploadState state = 3;
  uint64 version = 4;
  uint64 total_size = 5;
  string file_sha256 = 6;
  repeated PlannedChunk chunks = 7;
}
message ConfirmChunkRequest { string upload_id = 1; uint32 chunk_index = 2; }
message ConfirmChunkReply {}
message CommitUploadRequest { string upload_id = 1; }
message CommitUploadReply { string object_id = 1; }
message GetObjectRequest { string object_id = 1; }
message GetObjectReply {
  string object_id = 1;
  uint64 version = 2;
  uint64 total_size = 3;
  string file_sha256 = 4;
  repeated PlannedChunk chunks = 5;
}
